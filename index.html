<!doctype html>
<!-- Modified by sav-maya -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport with proper scaling and notch support -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Theme color for browser chrome (matches the header) -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FFFFFF" />
    <!-- Installable app: manifest plus the iOS equivalents -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="1M Boxes" />
    <!-- Disable phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Microsoft tile color -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/Recursive-Casual-Latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>1 Million Boxes</title>
    <meta
      name="description"
      content="A friendly, live game of Dots & Boxes for you and your friends. Join one of four teams, draw lines and claim boxes on one shared board."
    />
    <!-- OpenGraph meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="1 Million Boxes" />
    <meta
      property="og:description"
      content="Draw the fourth line to claim the box. Four teams share one live board."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The 1 Million Boxes logo beside a sketched Dots & Boxes grid"
    />
    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="1 Million Boxes" />
    <meta
      name="twitter:description"
      content="Draw the fourth line to claim the box. Four teams share one live board."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The 1 Million Boxes logo beside a sketched Dots & Boxes grid"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
